# Fast path: build ONLY the FTTR frontend/backend packages for in-place upgrade.
# Avoids the ~2h full firmware build. Outputs apk/ipk packages + ready-to-copy JS.
name: build-fttr-packages

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note (e.g. which fix)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf help2man intltool libelf-dev libglib2.0-dev libgmp-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm ninja-build patch pkgconf python3 python3-pip \
            python3-ply python3-docutils python3-pyelftools re2c rsync scons squashfs-tools swig texinfo \
            uglifyjs unzip wget xxd zlib1g-dev zstd

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: fttr-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: fttr-ccache-${{ runner.os }}-

      - name: Clone PonWrt
        run: |
          git clone --depth=1 https://github.com/pbs05/ponwrt.git ponwrt
          cd ponwrt && git log -1 --oneline

      - name: Configure (feeds + defconfig)
        run: |
          set +e
          CI_ROOT="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/scripts/configure.sh" master true true > /tmp/configure.log 2>&1
          rc=$?
          tail -n 120 /tmp/configure.log
          [ $rc -ne 0 ] && exit $rc
          exit 0

      - name: Build toolchain (needed to compile packages)
        run: |
          set +e
          export CCACHE_DIR=~/.ccache
          ( cd ponwrt && make -j"$(nproc)" tools/install toolchain/install ) > /tmp/toolchain.log 2>&1
          rc=$?
          echo "=== toolchain rc=$rc ==="
          tail -n 80 /tmp/toolchain.log
          exit $rc

      - name: Build FTTR packages only
        run: |
          set +e
          export CCACHE_DIR=~/.ccache
          (
            cd ponwrt || exit 1
            # IMPORTANT: make targets use the PACKAGE DIR name, not the Package/ name.
            # openwrt-fttr lives at feeds/fttr/package/fttr -> package/feeds/fttr/fttr
            resolve() {
              for cand in "package/$1" "package/feeds/fttr/$1"; do
                [ -d "$cand" ] && { echo "$cand"; return 0; }
              done
              return 1
            }
            dirs=""
            for name in openwrt-fttr fttr h3c-fmcs h3c-fmcs-firmware luci-app-fttr; do
              d=$(resolve "$name") || continue
              case " $dirs " in *" $d "*) continue ;; esac
              dirs="$dirs $d"
            done
            echo "resolved package dirs:$dirs"
            [ -z "$dirs" ] && { echo "NO PACKAGE DIRS RESOLVED"; exit 3; }
            rc=0
            for d in $dirs; do
              echo "===== compile $d ====="
              make -j1 V=s "$d/compile" || { rc=$?; break; }
              echo "===== install $d ====="
              make -j1 "$d/install" || { rc=$?; break; }
            done
            exit $rc
          ) > /tmp/pkgbuild.log 2>&1
          rc=$?
          echo "=== pkg build rc=$rc ==="
          echo "=== ERROR LINES ==="
          grep -n -iE "error|failed|no such file|not found|cargo|rustc|undefined reference" /tmp/pkgbuild.log | tail -100 || true
          echo "=== PACKAGE BUILD LOGS ==="
          find ponwrt/logs -type f -path '*fttr*' -o -path '*fmcs*' 2>/dev/null | head -40 || true
          for f in $(find ponwrt/logs -type f \( -path '*openwrt-fttr*' -o -path '*h3c-fmcs*' \) 2>/dev/null | head -6); do
            echo "----- $f -----"; tail -n 80 "$f"
          done
          echo "=== TAIL 200 ==="
          tail -n 200 /tmp/pkgbuild.log
          exit $rc

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fttr-build-diagnostics
          path: |
            /tmp/pkgbuild.log
            /tmp/toolchain.log
            /tmp/configure.log
            ponwrt/logs/
          if-no-files-found: warn

      - name: Collect packages
        run: |
          mkdir -p out
          echo "=== fttr packages built ==="
          find ponwrt/bin \( -name '*.apk' -o -name '*.ipk' \) | grep -Ei 'fttr|fmcs' | tee /tmp/pkgs.txt
          while read -r f; do cp "$f" out/; done < /tmp/pkgs.txt
          # frontend standalone JS (can be copied directly to device)
          mkdir -p out/frontend
          cp ponwrt/package/luci-app-fttr/htdocs/luci-static/resources/view/fttr/config.js out/frontend/ 2>/dev/null || \
          find ponwrt -path '*view/fttr/config.js' -exec cp {} out/frontend/ \; 2>/dev/null || true
          ls -lh out/

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: fttr-packages
          path: out/
          if-no-files-found: warn
